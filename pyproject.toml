[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantmind-mvp"
version = "0.1.0"
description = "Futures-first AI-assisted quantitative research laboratory"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pyjwt>=2.8.0",
  "python-multipart>=0.0.9",
  "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
